<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>Teams and Outlook tabs</title>
  <link rel="stylesheet" href="tabs.css">
</head>
<body>
  <nav aria-label="Application tabs">
    <span class="brand" aria-hidden="true">Workspace</span>
    <div role="tablist" aria-label="Microsoft apps">
      <button id="teams" role="tab" aria-selected="true" tabindex="0">Teams</button>
      <button id="outlook" role="tab" aria-selected="false" tabindex="-1">Outlook</button>
    </div>
    <span id="status" role="status" aria-live="polite"></span>
    <button id="reload" title="Reload Outlook" aria-label="Reload Outlook" hidden>↻</button>
  </nav>
  <script src="tabs.js"></script>
</body>
</html>
